# Grafana：可视化 Karmada / 宿主集群 Prometheus 指标，并预导入 5 个官方 Karmada Dashboard。
#
# 设计要点：
#   - 管理员口令来自 Secret（grafana-admin），不含任何明文默认密码
#   - 通过 provisioning 自动配置 Prometheus 数据源（uid=prometheus，名称 Prometheus）
#   - 5 个官方 Dashboard 由 ConfigMap karmada-dashboards 挂载，
#     dashboard provisioning 自动导入；Dashboard 内 $DS_PROMETHEUS 变量绑定到数据源 Prometheus
#   - 固定在 control-plane 节点
#   - 数据持久化到 PVC（与 Prometheus 一致，避免 hostPath 在节点漂移时丢数据）
#   - 无对外暴露（ClusterIP Service，仅集群内访问）
#
# 参考：
#   - https://karmada.io/docs/administrator/monitoring/karmada-observability#installation
#   - dashboards: deploy/k8s/monitoring/dashboards/ + dashboards-configmap.yaml
---
# Grafana 数据源 provisioning：Prometheus（内部地址 prometheus.monitoring.svc:9090）。
# uid 固定为 prometheus；Dashboard 中 $DS_PROMETHEUS 会在导入时自动绑定到该数据源。
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        uid: prometheus
        url: http://prometheus.monitoring.svc:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 30s
---
# Grafana dashboard provisioning provider：从 /var/lib/grafana/dashboards 读取 *.json。
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
  labels:
    app: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Karmada'
        orgId: 1
        folder: 'Karmada'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      # 与 datastore / master 同节点：面板读取 Prometheus，行为一致性优先。
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.3.1
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: GF_SERVER_ROOT_URL
              value: http://localhost:3000
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: karmada-dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: grafana-data
              mountPath: /var/lib/grafana
              subPath: grafana
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: karmada-dashboards
          configMap:
            name: karmada-dashboards
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
  labels:
    app: grafana
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
