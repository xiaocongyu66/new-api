name: Route Unit EWMA Stress

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Test scenario'
        required: true
        type: choice
        default: smoke
        options: [smoke]
      target_url:
        description: 'Gateway /v1 URL (NodePort, Ingress, or port-forward)'
        required: true
        type: string
        default: 'http://127.0.0.1:18080/v1'
      api_key:
        description: 'Admin bearer token (default: K8S_STRESS_API_KEY secret)'
        required: false
        type: string
        default: ''
      model:
        description: 'Model to request'
        required: false
        type: string
        default: 'mock-ok'
      requests:
        description: 'Number of requests to send'
        required: false
        type: string
        default: '100'
      concurrency:
        description: 'Concurrent workers'
        required: false
        type: string
        default: '8'
      replica:
        description: 'Mock upstream replica count'
        required: false
        type: string
        default: '1'
      kube_config:
        description: 'Base64 kubeconfig (default: KUBE_CONFIG_B64 secret)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  TARGET_URL: ${{ inputs.target_url }}
  API_KEY: ${{ inputs.api_key || secrets.K8S_STRESS_API_KEY }}
  MODEL: ${{ inputs.model }}
  REQUESTS: ${{ inputs.requests }}
  CONCURRENCY: ${{ inputs.concurrency }}
  REPLICA: ${{ inputs.replica }}
  KUBE_CONFIG_B64: ${{ inputs.kube_config || secrets.KUBE_CONFIG_B64 }}

jobs:
  route-unit-ewma-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl
        if: env.KUBE_CONFIG_B64 != ''
        run: |
          mkdir -p ~/.kube
          echo '${{ env.KUBE_CONFIG_B64 }}' | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Start mock upstream
        id: mock
        run: |
          set -euo pipefail
          # Write mock fixture to a known location
          mkdir -p /tmp/mock
          cp tests/route_unit_stress/fixtures/mock_upstream.py /tmp/mock/
          # Start mock server with ndjson output
          export MOCK_PORT=8099
          export MOCK_NDJSON=/tmp/mock_upstream.ndjson
          python3 /tmp/mock/mock_upstream.py > /tmp/mock.log 2>&1 &
          MOCK_PID=$!
          echo "MOCK_PID=$MOCK_PID" >> "$GITHUB_ENV"
          # Wait for healthz
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/healthz >/dev/null; then
              echo "Mock upstream ready"
              exit 0
            fi
            sleep 1
          done
          echo "Mock upstream failed to start" >&2
          exit 1

      - name: Scale mock replicas
        if: env.REPLICA != '1'
        run: |
          # For multi-replica, start additional instances on different ports
          # (Simplified: single instance for smoke; k8s path would use Deployment)
          echo "Single replica mode for smoke; replica=${{ env.REPLICA }} noted"

      - name: Preflight gateway
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --connect-timeout 5 -H "Authorization: Bearer $API_KEY" "$TARGET_URL/models" >/dev/null; then
              echo "Gateway reachable"
              exit 0
            fi
            sleep 2
          done
          echo "Gateway not reachable at $TARGET_URL" >&2
          exit 1

      - name: Run smoke test
        id: smoke
        env:
          MOCK_NDJSON: /tmp/mock_upstream.ndjson
        run: |
          set -euo pipefail
          python3 tests/route_unit_stress/run_smoke.py \
            --gateway-url "$TARGET_URL" \
            --token "$API_KEY" \
            --mock-url "http://127.0.0.1:8099" \
            --requests ${{ env.REQUESTS }} \
            --concurrency ${{ env.CONCURRENCY }} \
            --model "${{ env.MODEL }}" \
            --out-dir runtime/smoke-${{ github.run_id }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-unit-ewma-stress-${{ github.run_id }}
          path: runtime/smoke-*
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          SUMMARY_FILE="runtime/smoke-${{ github.run_id }}/summary.json"
          if [ -f "$SUMMARY_FILE" ]; then
            VERDICT=$(jq -r .verdict "$SUMMARY_FILE")
            TOTAL=$(jq -r .total_requests "$SUMMARY_FILE")
            MATCHED=$(jq -r .matched_pairs "$SUMMARY_FILE")
            echo "## Route Unit EWMA Stress - ${{ inputs.scenario }}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Verdict | $VERDICT |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Total Requests | $TOTAL |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Matched Pairs | $MATCHED |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ "$VERDICT" != "PASS" ]; then
              echo "### Mismatches" >> "$GITHUB_STEP_SUMMARY"
              jq -r '.missing_in_audit[]? | "Missing in audit: \(.)"' "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
              jq -r '.missing_in_mock[]? | "Missing in mock: \(.)"' "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
              jq -r '.identity_mismatch[]? | "Identity mismatch: \(.request_id) \(.type)"' "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
              jq -r '.attempt_gaps[]? | "Attempt gap: \(.request_id) expected=\(.expected) actual=\(.actual)"' "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            fi
          else
            echo "No summary.json found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cleanup mock
        if: always()
        run: |
          if [ -n "${{ env.MOCK_PID }}" ]; then
            kill ${{ env.MOCK_PID }} 2>/dev/null || true
          fi