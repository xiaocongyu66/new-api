name: Route Unit EWMA Stress

# One stress run at a time, cluster-wide. Batches are dispatched separately but
# share a single k3s cluster, its channels and its gateway deployment, so an
# overlapping run would corrupt both. Queue instead of cancelling: a half-run
# batch produces artifacts that look complete but hold interleaved traffic.
concurrency:
  group: route-unit-ewma-stress
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Test scenario (smoke, S1-S13, or all)'
        required: true
        type: choice
        default: smoke
        options: [smoke, S1, S2, S3, S4, S5, S6, S7, S8, S9, S10, S11, S12, S13, all]
      target_url:
        description: 'Gateway /v1 URL (NodePort, Ingress, or port-forward)'
        required: true
        type: string
        default: 'http://127.0.0.1:18080/v1'
      api_key:
        description: 'User bearer token (sk-...)'
        required: false
        type: string
        default: ''
      admin_token:
        description: 'Admin JWT for audit endpoint (default: K8S_STRESS_ADMIN_TOKEN secret, then auto-login)'
        required: false
        type: string
        default: ''
      admin_username:
        description: 'Username for auto-login (default: root). Ignored if admin_token is provided.'
        required: false
        type: string
        default: 'root'
      admin_password:
        description: 'Password for auto-login (default: 123456). Ignored if admin_token is provided.'
        required: false
        type: string
        default: '123456'
      gateway_admin_url:
        description: 'Gateway admin base URL (default: derived from target_url by stripping /v1). Used only for auto-login.'
        required: false
        type: string
        default: ''
      model:
        description: 'Model to request'
        required: false
        type: string
        default: 'mock-ok'
      alias:
        description: 'Route alias (subject route name)'
        required: false
        type: string
        default: 'ewma-stress-subject'
      requests:
        description: 'Number of requests per scenario'
        required: false
        type: string
        default: '13000'
      warmup:
        description: 'Warmup requests before measurement'
        required: false
        type: string
        default: '44'
      concurrency:
        description: 'Concurrent workers'
        required: false
        type: string
        default: '64'
      stream_ratio:
        description: 'Stream ratio 0-1 (empty = scenario default: S1=0.2, S2/S3=1.0)'
        required: false
        type: string
        default: ''
      allow_affinity:
        description: 'Allow channel_affinity_setting.enabled=true (default false, runner requires false)'
        required: false
        type: boolean
        default: false
      mock_url:
        description: 'Mock upstream base URL'
        required: false
        type: string
        default: 'http://127.0.0.1:8099'
      kube_config:
        description: 'Base64 kubeconfig (default: KUBE_CONFIG_B64 secret)'
        required: false
        type: string
        default: ''

      route_count:
        description: 'S5 pool size override (empty = scenario default: 2/4/8)'
        required: false
        type: string
        default: ''
      bad_channel_id:
        description: 'S5 channel id of the BAD route (empty = first route)'
        required: false
        type: string
        default: ''
      share_window_size:
        description: 'S6 RouteStatsShareWindowSize override (empty = scenario default: 50/200/1000)'
        required: false
        type: string
        default: ''
      replica:
        description: 'S10 replica count; global share is re-aggregated from raw attempts, never averaged per pod'
        required: false
        type: string
        default: ''
      specific_channel_id:
        description: 'S11 channel id used for the specific-channel path and administrative probes'
        required: false
        type: string
        default: ''
      fault_hook:
        description: 'S13 shell command flipping the subject route mock to a failing mode'
        required: false
        type: string
        default: ''
      recover_hook:
        description: 'S13 shell command flipping the subject route mock back to ok'
        required: false
        type: string
        default: ''
      enable_pprof:
        description: 'Sample gateway Go heap/GC via pprof during the run (passes --pprof-url to the runner)'
        required: false
        type: boolean
        default: false
      pprof_url:
        description: 'Gateway pprof base URL when enable_pprof is true (default 127.0.0.1:6060)'
        required: false
        type: string
        default: 'http://127.0.0.1:6060'

env:
  TARGET_URL: ${{ inputs.target_url }}
  API_KEY: ${{ inputs.api_key }}
  ADMIN_TOKEN: ${{ inputs.admin_token || secrets.K8S_STRESS_ADMIN_TOKEN }}
  ADMIN_USERNAME: ${{ inputs.admin_username || 'root' }}
  ADMIN_PASSWORD: ${{ inputs.admin_password || '123456' }}
  # GitHub Actions expressions have no string-replace function at all (no
  # replace, no replaceAll). Calling one fails workflow parsing at dispatch
  # time with HTTP 422, so no run can ever start. Pass the raw input and strip
  # the /v1 suffix in shell at the point of use instead.
  GATEWAY_ADMIN_URL: ${{ inputs.gateway_admin_url }}
  MODEL: ${{ inputs.model }}
  ALIAS: ${{ inputs.alias }}
  REQUESTS: ${{ inputs.requests }}
  WARMUP: ${{ inputs.warmup }}
  CONCURRENCY: ${{ inputs.concurrency }}
  STREAM_RATIO: ${{ inputs.stream_ratio }}
  ALLOW_AFFINITY: ${{ inputs.allow_affinity }}
  MOCK_URL: ${{ inputs.mock_url }}
  ROUTE_COUNT: ${{ inputs.route_count }}
  BAD_CHANNEL_ID: ${{ inputs.bad_channel_id }}
  SHARE_WINDOW_SIZE: ${{ inputs.share_window_size }}
  REPLICA: ${{ inputs.replica }}
  SPECIFIC_CHANNEL_ID: ${{ inputs.specific_channel_id }}
  FAULT_HOOK: ${{ inputs.fault_hook }}
  RECOVER_HOOK: ${{ inputs.recover_hook }}
  ENABLE_PPROF: ${{ inputs.enable_pprof }}
  PPROF_URL: ${{ inputs.pprof_url }}

jobs:
  route-unit-ewma-smoke:
    if: ${{ inputs.scenario == 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve gateway host alias
        env:
          TARGET_URL: ${{ env.TARGET_URL }}
          GATEWAY_ADMIN_URL: ${{ env.GATEWAY_ADMIN_URL }}
        run: |
          set -euo pipefail
          # The ingress routes solely on Host, so target_url must carry the ingress
          # host, which can be a placeholder with no public DNS. When it does not
          # resolve, map it to the admin URL's address (the node running the
          # ingress) so the preflight curl reaches the gateway instead of dying on
          # DNS. No extra input: workflow_dispatch allows at most 25.
          NAME=$(printf '%s' "$TARGET_URL" | sed -E 's#^[a-zA-Z]+://##; s#[:/].*$##')
          if [ -z "$NAME" ]; then
            echo "target_url has no host; nothing to map"
            exit 0
          fi
          if getent hosts "$NAME" >/dev/null 2>&1; then
            echo "$NAME already resolves; no hosts entry added"
            exit 0
          fi
          IP=$(printf '%s' "$GATEWAY_ADMIN_URL" | sed -E 's#^[a-zA-Z]+://##; s#[:/].*$##')
          if ! printf '%s' "$IP" | grep -Eq '^[0-9]+(\.[0-9]+){3}$'; then
            echo "::error::$NAME does not resolve and gateway_admin_url ('$GATEWAY_ADMIN_URL') has no IP literal to map it to"
            exit 1
          fi
          echo "$IP $NAME" | sudo tee -a /etc/hosts >/dev/null
          getent hosts "$NAME"
          # Requests must carry the ingress host, otherwise the ingress has no rule
          # to match and answers 404. Now that the name resolves, rewrite the admin
          # base URL from the bare IP to that host, keeping scheme and port.
          ADMIN_PORT=$(printf '%s' "$GATEWAY_ADMIN_URL" | sed -nE 's#^[a-zA-Z]+://[^:/]+:([0-9]+).*$#\1#p')
          if [ -n "$ADMIN_PORT" ]; then
            echo "GATEWAY_ADMIN_URL=http://$NAME:$ADMIN_PORT" >> "$GITHUB_ENV"
            echo "admin URL rewritten to http://$NAME:$ADMIN_PORT"
            # The same port applies to relay traffic. Without a port target_url
            # resolves to :80, where the ingress controller is not listening when it
            # is exposed via NodePort, so every relay request fails to connect while
            # admin calls on the explicit port succeed.
            TARGET_PORT=$(printf '%s' "$TARGET_URL" | sed -nE 's#^[a-zA-Z]+://[^:/]+:([0-9]+).*$#\1#p')
            if [ -z "$TARGET_PORT" ]; then
              TARGET_PATH=$(printf '%s' "$TARGET_URL" | sed -E 's#^[a-zA-Z]+://[^/]+##')
              echo "TARGET_URL=http://$NAME:$ADMIN_PORT$TARGET_PATH" >> "$GITHUB_ENV"
              echo "target URL rewritten to http://$NAME:$ADMIN_PORT$TARGET_PATH"
            fi
          fi

      - name: Configure kubectl
        # KUBE_CONFIG_B64 was never in env, so `if: env.KUBE_CONFIG_B64 != ''`
        # was always false and this step silently skipped. Secrets have to be
        # named in env: to be visible to `if:` and to the shell.
        env:
          KUBE_CONFIG_B64: ${{ inputs.kube_config || secrets.KUBE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KUBE_CONFIG_B64:-}" ]; then
            echo "no kubeconfig supplied; kubectl-dependent steps will fail loudly if they need it"
            exit 0
          fi
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          # k3s certificates only cover the cluster-internal IP, so a public
          # endpoint needs TLS verification skipped and the CA data removed.
          kubectl config set-cluster default --insecure-skip-tls-verify=true
          kubectl config unset clusters.default.certificate-authority-data
          kubectl cluster-info

      - name: Start mock upstream
        id: mock
        run: |
          set -euo pipefail
          # In-cluster is not a separate switch: workflow_dispatch is already at the
          # 25-input ceiling, and the mode is fully determined by whether a cluster
          # is reachable. With a kubeconfig the gateway is in k3s and cannot dial the
          # runner's loopback, so the mock must live in the cluster. Without one the
          # gateway is local and the runner-local mock is correct.
          if command -v kubectl >/dev/null 2>&1 && [ -f ~/.kube/config ]; then
            MOCK_IN_CLUSTER=true
          else
            MOCK_IN_CLUSTER=false
          fi
          echo "MOCK_IN_CLUSTER=$MOCK_IN_CLUSTER" >> "$GITHUB_ENV"
          if [ "${MOCK_IN_CLUSTER}" != "true" ]; then
            mkdir -p /tmp/mock
            cp tests/route_unit_stress/fixtures/mock_upstream.py /tmp/mock/
            export MOCK_PORT=8099
            export MOCK_NDJSON=/tmp/mock_upstream.ndjson
            python3 /tmp/mock/mock_upstream.py > /tmp/mock.log 2>&1 &
            echo "MOCK_PID=$!" >> "$GITHUB_ENV"
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8099/healthz >/dev/null; then
                echo "Mock upstream ready (runner-local)"
                exit 0
              fi
              sleep 1
            done
            echo "Mock upstream failed to start" >&2
            exit 1
          fi
          # The gateway runs in the cluster and can never dial the runner's
          # loopback, so a runner-local mock makes every reconciliation compare
          # gateway attempts against zero upstream rows. Run the mock in the
          # cluster instead and reach it from here through a port-forward.
          if ! command -v kubectl >/dev/null 2>&1 || [ ! -f ~/.kube/config ]; then
            echo "::error::mock_in_cluster=true needs a kubeconfig; supply KUBE_CONFIG_B64"
            exit 1
          fi
          kubectl create configmap route-unit-mock-src \
            --from-file=mock_upstream.py=tests/route_unit_stress/fixtures/mock_upstream.py \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f - <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: route-unit-mock
            labels:
              app: route-unit-mock
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: route-unit-mock
            template:
              metadata:
                labels:
                  app: route-unit-mock
              spec:
                containers:
                  - name: mock
                    image: python:3.12-alpine
                    command: ["python", "/mock/mock_upstream.py"]
                    env:
                      - name: MOCK_PORT
                        value: "8099"
                      - name: MOCK_NDJSON
                        value: /tmp/mock_upstream.ndjson
                    ports:
                      - containerPort: 8099
                    readinessProbe:
                      httpGet:
                        path: /healthz
                        port: 8099
                      initialDelaySeconds: 2
                      periodSeconds: 2
                    volumeMounts:
                      - name: mock-src
                        mountPath: /mock
                        readOnly: true
                    resources:
                      requests:
                        cpu: 100m
                        memory: 128Mi
                      limits:
                        cpu: "1"
                        memory: 512Mi
                volumes:
                  - name: mock-src
                    configMap:
                      name: route-unit-mock-src
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: route-unit-mock
          spec:
            selector:
              app: route-unit-mock
            ports:
              - port: 80
                targetPort: 8099
          YAML
          # Restart so a re-run picks up the current fixture instead of the
          # ConfigMap the pod started with.
          kubectl rollout restart deployment/route-unit-mock
          kubectl rollout status deployment/route-unit-mock --timeout=180s
          # /healthz and /_ndjson are read from here; the gateway uses the Service DNS.
          kubectl port-forward service/route-unit-mock 8099:80 > /tmp/mock-pf.log 2>&1 &
          echo "MOCK_PF_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/healthz >/dev/null 2>&1; then
              echo "In-cluster mock reachable via port-forward"
              exit 0
            fi
            sleep 1
          done
          echo "::error::port-forward to route-unit-mock never became ready"
          cat /tmp/mock-pf.log || true
          exit 1

      - name: Point stress channels at the in-cluster mock
        if: env.MOCK_IN_CLUSTER == 'true'
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MODEL: ${{ env.MODEL }}
        run: |
          set -euo pipefail
          # Reconciliation compares gateway attempts against the mock's own records,
          # so every attempt has to land on the mock this run reads from. Channels
          # left pointing at another upstream produce audit rows with no matching
          # upstream row and the scenario is reported DATA_INVALID.
          POD=$(kubectl get pods -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$POD" ]; then
            echo "::error::no postgres pod found; cannot provision stress channels"
            exit 1
          fi
          kubectl exec -i "$POD" -- env PGPASSWORD="$POSTGRES_PASSWORD" \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<SQL
          DELETE FROM abilities WHERE channel_id BETWEEN 91001 AND 91002;
          DELETE FROM channel_model_routes WHERE channel_id BETWEEN 91001 AND 91002;
          DELETE FROM channels WHERE id BETWEEN 91001 AND 91002;
          INSERT INTO channels (id, type, key, status, name, created_time, base_url, models, "group", auto_ban, other_info, settings, header_override)
          SELECT 91000 + n, 1, 'mock', 1, 'route-unit-mock-' || n,
                 EXTRACT(EPOCH FROM now())::bigint,
                 'http://route-unit-mock',
                 '${MODEL}', 'default', 0, '', '',
                 -- S11/S12 reconcile per (request_id, attempt); without forwarding the
                 -- client id the mock records an empty one and cannot be correlated.
                 '{"X-Request-Id":"{client_header:X-Request-Id}"}'
          FROM generate_series(1,2) AS n;
          INSERT INTO abilities ("group", model, channel_id, enabled)
          SELECT 'default', '${MODEL}', 91000 + n, true FROM generate_series(1,2) AS n;
          -- Route units are not inserted here: SeedChannelModelRoutes() derives them
          -- from every channel on master startup, and the restart below triggers it.
          -- Hand-written rows would only risk drifting from that expansion.
          SELECT id, name, base_url, models FROM channels WHERE id BETWEEN 91001 AND 91002;
          SQL
          # The audit ring is per process, and the Service load-balances across
          # workers, so with N replicas the runner sees roughly 1/N of the attempts
          # and reconciliation reports the rest as missing_in_audit. The smoke proves
          # the data chain, not replica behaviour, so pin it to a single worker;
          # multi-replica share aggregation is what S10 covers, and it polls each pod
          # directly.
          kubectl scale deployment/new-api-worker --replicas=1
          # Master and worker must not restart together. Only the master seeds route
          # units, and a worker booting alongside it caches whatever pool exists at
          # that moment; if seeding has not finished the worker holds an empty pool
          # for a full SYNC_FREQUENCY (60s) and answers model_not_found. Restart the
          # master, wait for the route units to exist, and only then cycle the worker
          # so it loads a complete pool.
          kubectl rollout restart deployment/new-api-master
          kubectl rollout status deployment/new-api-master --timeout=300s
          for i in $(seq 1 60); do
            ROUTES=$(kubectl exec -i "$POD" -- env PGPASSWORD="$POSTGRES_PASSWORD" \
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
              "SELECT count(*) FROM channel_model_routes WHERE channel_id BETWEEN 91001 AND 91002;" | tr -d '[:space:]')
            [ "${ROUTES:-0}" -ge 2 ] && break
            sleep 2
          done
          echo "route units for stress channels: ${ROUTES:-0}"
          if [ "${ROUTES:-0}" -lt 2 ]; then
            echo "::error::route-unit seeding produced ${ROUTES:-0} rows for the stress channels; expected 2"
            kubectl exec -i "$POD" -- env PGPASSWORD="$POSTGRES_PASSWORD" \
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -c "SELECT channel_id, \"group\", public_model_alias, upstream_model, static_weight, enabled FROM channel_model_routes WHERE channel_id BETWEEN 91001 AND 91002;" || true
            exit 1
          fi
          kubectl rollout restart deployment/new-api-worker
          kubectl rollout status deployment/new-api-worker --timeout=420s
          # Readiness only proves /api/status answers; the route pool is loaded on the
          # same boot path, so confirm the worker actually resolves the alias before
          # handing the run to the smoke.
          for i in $(seq 1 45); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
              -H "Authorization: Bearer $API_KEY" -H 'Content-Type: application/json' \
              -X POST -d "{\"model\":\"${MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":1}" \
              "${TARGET_URL%/}/chat/completions" || true)
            if [ "$CODE" = "200" ]; then
              echo "worker resolves ${MODEL} (probe HTTP $CODE)"
              break
            fi
            sleep 2
          done
          if [ "${CODE:-}" != "200" ]; then
            echo "::error::worker still cannot route ${MODEL} after restart (last HTTP ${CODE:-none})"
            exit 1
          fi

      - name: Resolve admin token
        id: admin_login_smoke
        env:
          ADMIN_TOKEN: ${{ env.ADMIN_TOKEN }}
          ADMIN_USERNAME: ${{ env.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
          GATEWAY_ADMIN_URL: ${{ env.GATEWAY_ADMIN_URL }}
          TARGET_URL: ${{ env.TARGET_URL }}
        run: |
          set -euo pipefail
          # Empty means "derive from target_url by stripping the /v1 suffix";
          # expressions cannot do string replacement, so it happens here.
          if [ -z "${GATEWAY_ADMIN_URL:-}" ]; then
            GATEWAY_ADMIN_URL="${TARGET_URL%/v1}"
            GATEWAY_ADMIN_URL="${GATEWAY_ADMIN_URL%/}"
          fi
          login_url="${GATEWAY_ADMIN_URL%/}/api/user/login"
          probe_token() {
            curl -fsS --max-time 5 -H "Authorization: Bearer $1"               "${GATEWAY_ADMIN_URL%/}/api/route_unit/audit?alias=__probe__&limit=1" >/dev/null 2>&1
          }
          if [ -n "$ADMIN_TOKEN" ] && probe_token "$ADMIN_TOKEN"; then
            echo "Using provided admin token"
            echo "ADMIN_TOKEN_FINAL=$ADMIN_TOKEN" >> "$GITHUB_ENV"
            exit 0
          fi
          for i in $(seq 1 15); do
            RESP=$(curl -fsS --max-time 10 -H 'Content-Type: application/json' \
              -X POST -d "{\"username\":\"$ADMIN_USERNAME\",\"password\":\"$ADMIN_PASSWORD\"}" \
              "$login_url" 2>/dev/null || true)
            if [ -n "$RESP" ]; then
              TOKEN=$(echo "$RESP" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("data",{}).get("access_token",""))' 2>/dev/null || true)
              if [ -n "$TOKEN" ] && probe_token "$TOKEN"; then
                echo "Auto-login admin token obtained (len=${#TOKEN})"
                echo "::add-mask::$TOKEN"
                echo "ADMIN_TOKEN_FINAL=$TOKEN" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
            echo "Login attempt $i failed, retrying..."
            sleep 2
          done
          echo "::error::Failed to obtain admin token from $login_url"
          exit 1

      - name: Preflight gateway
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --connect-timeout 5 -H "Authorization: Bearer $API_KEY" "$TARGET_URL/models" >/dev/null; then
              echo "Gateway reachable"
              exit 0
            fi
            sleep 2
          done
          echo "Gateway not reachable at $TARGET_URL" >&2
          exit 1

      - name: Run smoke test (S11)
        id: smoke
        env:
          # In-cluster the records live in the mock pod, so leave this unset and let
          # the runner pull them from the mock's /_ndjson export over the
          # port-forward. Runner-local runs share the file and read it directly.
          MOCK_NDJSON: ${{ env.MOCK_IN_CLUSTER == 'true' && '' || '/tmp/mock_upstream.ndjson' }}
        run: |
          set -euo pipefail
          # run_smoke.py builds "{gateway_url}/api/status" and "{gateway_url}/v1/models",
          # so it needs the gateway base without the /v1 suffix. Passing target_url
          # verbatim yields /v1/api/status, which the gateway answers 404, and the
          # runner reports a healthz preflight failure.
          SMOKE_BASE="${TARGET_URL%/v1}"
          SMOKE_BASE="${SMOKE_BASE%/}"
          python3 tests/route_unit_stress/run_smoke.py \
            --gateway-url "$SMOKE_BASE" \
            --token "$API_KEY" \
            --admin-token "${{ env.ADMIN_TOKEN_FINAL }}" \
            --mock-url "$MOCK_URL" \
            --requests ${{ env.REQUESTS }} \
            --concurrency ${{ env.CONCURRENCY }} \
            --model "${{ env.MODEL }}" \
            --out-dir runtime/smoke-${{ github.run_id }}

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-unit-smoke-${{ github.run_id }}
          path: runtime/smoke-*
          retention-days: 14

      - name: Smoke summary
        if: always()
        run: |
          SUMMARY_FILE="runtime/smoke-${{ github.run_id }}/summary.json"
          if [ -f "$SUMMARY_FILE" ]; then
            VERDICT=$(jq -r .verdict "$SUMMARY_FILE")
            TOTAL=$(jq -r .total_requests "$SUMMARY_FILE")
            MATCHED=$(jq -r .matched_pairs "$SUMMARY_FILE")
            echo "## Route Unit EWMA Stress - Smoke (S11)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Verdict | $VERDICT |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Total Requests | $TOTAL |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Matched Pairs | $MATCHED |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ "$VERDICT" != "PASS" ]; then
              echo "### Mismatches" >> "$GITHUB_STEP_SUMMARY"
              jq -r '.missing_in_audit[]? | "Missing in audit: \(.)"' "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
              jq -r '.missing_in_mock[]? | "Missing in mock: \(.)"' "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
              jq -r '.identity_mismatch[]? | "Identity mismatch: \(.request_id) \(.type)"' "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
              jq -r '.attempt_gaps[]? | "Attempt gap: \(.request_id) expected=\(.expected) actual=\(.actual)"' "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            fi
          else
            echo "No summary.json found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cleanup mock
        if: always()
        run: |
          if [ -n "${{ env.MOCK_PID }}" ]; then
            kill ${{ env.MOCK_PID }} 2>/dev/null || true
          fi
          if [ -n "${{ env.MOCK_PF_PID }}" ]; then
            kill ${{ env.MOCK_PF_PID }} 2>/dev/null || true
          fi
          # Leave the cluster as found: the mock Deployment and the stress channels
          # would otherwise keep serving traffic and skew any later run.
          if [ "${{ env.MOCK_IN_CLUSTER }}" = "true" ]; then
            kubectl delete deployment/route-unit-mock service/route-unit-mock configmap/route-unit-mock-src --ignore-not-found=true || true
          fi

  route-unit-ewma-scenario:
    if: ${{ inputs.scenario != 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Every matrix job mutates cluster-wide state: it applies the same mock
      # Deployment name, rewrites channels 91001-91002, scales and restarts the
      # gateway, and writes options such as RouteStatsShareWindowSize. The audit
      # ring and the mock's ndjson are process-global too, so concurrent jobs
      # would interleave their attempts into each other's share windows. Run one
      # at a time; correctness here is worth the wall clock.
      max-parallel: 1
      matrix:
        scenario: ${{ fromJson(inputs.scenario == 'all' && '["S1","S2","S3","S4_NORETRY","S4_RETRY5","S4_RETRY10","S5_POOL2","S5_POOL4","S5_POOL8","S6_W50","S6_W200","S6_W1000","S7_W50","S7_W200","S7_W1000","S8_3K","S8_50K","S9_A10_W0","S9_A10_W200","S9_A30_W0","S9_A30_W200","S9_A50_W0","S9_A50_W200","S9_A70_W0","S9_A70_W200","S10_RACE","S10_GLOBAL","S10_RESTART","S11_FULL","S12_RETRY","S13_CASCADE"]' || inputs.scenario == 'S4' && '["S4_NORETRY","S4_RETRY5","S4_RETRY10"]' || inputs.scenario == 'S5' && '["S5_POOL2","S5_POOL4","S5_POOL8"]' || inputs.scenario == 'S6' && '["S6_W50","S6_W200","S6_W1000"]' || inputs.scenario == 'S7' && '["S7_W50","S7_W200","S7_W1000"]' || inputs.scenario == 'S8' && '["S8_3K","S8_50K"]' || inputs.scenario == 'S9' && '["S9_A10_W0","S9_A10_W200","S9_A30_W0","S9_A30_W200","S9_A50_W0","S9_A50_W200","S9_A70_W0","S9_A70_W200"]' || inputs.scenario == 'S10' && '["S10_RACE","S10_GLOBAL","S10_RESTART"]' || inputs.scenario == 'S11' && '["S11_FULL"]' || inputs.scenario == 'S12' && '["S12_RETRY"]' || inputs.scenario == 'S13' && '["S13_CASCADE"]' || format('["{0}"]', inputs.scenario)) }}
    env:
      SCENARIO: ${{ matrix.scenario }}
      REPLICA: ${{ inputs.replica != '' && inputs.replica || (startsWith(matrix.scenario, 'S10_GLOBAL') || startsWith(matrix.scenario, 'S10_RESTART')) && '2' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve gateway host alias
        env:
          TARGET_URL: ${{ env.TARGET_URL }}
          GATEWAY_ADMIN_URL: ${{ env.GATEWAY_ADMIN_URL }}
        run: |
          set -euo pipefail
          # The ingress routes solely on Host, so target_url must carry the ingress
          # host, which can be a placeholder with no public DNS. When it does not
          # resolve, map it to the admin URL's address (the node running the
          # ingress) so the preflight curl reaches the gateway instead of dying on
          # DNS. No extra input: workflow_dispatch allows at most 25.
          NAME=$(printf '%s' "$TARGET_URL" | sed -E 's#^[a-zA-Z]+://##; s#[:/].*$##')
          if [ -z "$NAME" ]; then
            echo "target_url has no host; nothing to map"
            exit 0
          fi
          if getent hosts "$NAME" >/dev/null 2>&1; then
            echo "$NAME already resolves; no hosts entry added"
            exit 0
          fi
          IP=$(printf '%s' "$GATEWAY_ADMIN_URL" | sed -E 's#^[a-zA-Z]+://##; s#[:/].*$##')
          if ! printf '%s' "$IP" | grep -Eq '^[0-9]+(\.[0-9]+){3}$'; then
            echo "::error::$NAME does not resolve and gateway_admin_url ('$GATEWAY_ADMIN_URL') has no IP literal to map it to"
            exit 1
          fi
          echo "$IP $NAME" | sudo tee -a /etc/hosts >/dev/null
          getent hosts "$NAME"
          # Requests must carry the ingress host, otherwise the ingress has no rule
          # to match and answers 404. Now that the name resolves, rewrite the admin
          # base URL from the bare IP to that host, keeping scheme and port.
          ADMIN_PORT=$(printf '%s' "$GATEWAY_ADMIN_URL" | sed -nE 's#^[a-zA-Z]+://[^:/]+:([0-9]+).*$#\1#p')
          if [ -n "$ADMIN_PORT" ]; then
            echo "GATEWAY_ADMIN_URL=http://$NAME:$ADMIN_PORT" >> "$GITHUB_ENV"
            echo "admin URL rewritten to http://$NAME:$ADMIN_PORT"
            # The same port applies to relay traffic. Without a port target_url
            # resolves to :80, where the ingress controller is not listening when it
            # is exposed via NodePort, so every relay request fails to connect while
            # admin calls on the explicit port succeed.
            TARGET_PORT=$(printf '%s' "$TARGET_URL" | sed -nE 's#^[a-zA-Z]+://[^:/]+:([0-9]+).*$#\1#p')
            if [ -z "$TARGET_PORT" ]; then
              TARGET_PATH=$(printf '%s' "$TARGET_URL" | sed -E 's#^[a-zA-Z]+://[^/]+##')
              echo "TARGET_URL=http://$NAME:$ADMIN_PORT$TARGET_PATH" >> "$GITHUB_ENV"
              echo "target URL rewritten to http://$NAME:$ADMIN_PORT$TARGET_PATH"
            fi
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure kubectl
        # KUBE_CONFIG_B64 was never in env, so `if: env.KUBE_CONFIG_B64 != ''`
        # was always false and this step silently skipped, which made the S10
        # replica scaling fail on "kubectl/kubeconfig unavailable".
        env:
          KUBE_CONFIG_B64: ${{ inputs.kube_config || secrets.KUBE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KUBE_CONFIG_B64:-}" ]; then
            echo "no kubeconfig supplied; kubectl-dependent steps will fail loudly if they need it"
            exit 0
          fi
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config set-cluster default --insecure-skip-tls-verify=true
          kubectl config unset clusters.default.certificate-authority-data
          kubectl cluster-info

      - name: Start mock upstream (multi-instance)
        id: mock
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mock
          cp tests/route_unit_stress/fixtures/mock_upstream.py /tmp/mock/
          MOCK_NDJSON=/tmp/mock_upstream.ndjson
          export MOCK_NDJSON
          PIDS=()
          BASE_PORT=18200

          # Determine number of mock instances and their MOCK_FORCE_MODE per scenario
          case "${SCENARIO}" in
            S4_NORETRY)
              INSTANCES=2
              MODES=("ok" "ratelimit_missing")
              ;;
            S4_RETRY5)
              INSTANCES=2
              MODES=("ok" "ratelimit_5s")
              ;;
            S4_RETRY10)
              INSTANCES=2
              MODES=("ok" "ratelimit_10s")
              ;;
            S5_POOL2)
              INSTANCES=2
              MODES=("q05" "ok")
              ;;
            S5_POOL4)
              INSTANCES=4
              MODES=("q05" "ok" "ok" "ok")
              ;;
            S5_POOL8)
              INSTANCES=8
              MODES=("q05" "ok" "ok" "ok" "ok" "ok" "ok" "ok")
              ;;
            S6_W50|S6_W200|S6_W1000)
              INSTANCES=4
              MODES=("ok" "ok" "ttft_4000" "ttft_4000")
              ;;
            S7_W50|S7_W200|S7_W1000)
              INSTANCES=4
              MODES=("ok" "ok" "ttft_4000" "ttft_4000")
              ;;
            S8_3K|S8_50K)
              INSTANCES=1
              MODES=("ok")
              ;;
            S9_A*)
              INSTANCES=3
              MODES=("ok" "ok" "ok")
              ;;
            S10_*)
              INSTANCES=2
              MODES=("ok" "ok")
              ;;
            S11_FULL)
              INSTANCES=4
              MODES=("ok" "ok" "ok" "ok")
              ;;
            S12_RETRY)
              INSTANCES=2
              MODES=("ok" "first_fail_then_ok")
              ;;
            S13_CASCADE)
              INSTANCES=2
              MODES=("ok" "ok")
              ;;
            *)
              INSTANCES=1
              MODES=("ok")
              ;;
          esac

          echo "MOCK_INSTANCES=${INSTANCES}" >> "$GITHUB_ENV"
          echo "MOCK_BASE_PORT=${BASE_PORT}" >> "$GITHUB_ENV"

          # In-cluster is not a separate input: workflow_dispatch is already at the
          # 25-input ceiling, and the mode is fully determined by whether a cluster is
          # reachable. With a kubeconfig the gateway runs in k3s and cannot dial the
          # runner's loopback, so the mocks must live in the cluster. Without one the
          # gateway is local and runner-local mocks are correct.
          if command -v kubectl >/dev/null 2>&1 && [ -f ~/.kube/config ]; then
            MOCK_IN_CLUSTER=true
          else
            MOCK_IN_CLUSTER=false
          fi
          echo "MOCK_IN_CLUSTER=$MOCK_IN_CLUSTER" >> "$GITHUB_ENV"

          if [ "$MOCK_IN_CLUSTER" != "true" ]; then
            for i in $(seq 0 $((INSTANCES - 1))); do
              PORT=$((BASE_PORT + i))
              export MOCK_FORCE_MODE="${MODES[$i]}"
              export MOCK_PORT="${PORT}"
              python3 /tmp/mock/mock_upstream.py > "/tmp/mock_${PORT}.log" 2>&1 &
              PIDS+=($!)
              echo "MOCK_PID_${PORT}=${PIDS[-1]}" >> "$GITHUB_ENV"
            done
            for i in $(seq 0 $((INSTANCES - 1))); do
              PORT=$((BASE_PORT + i))
              for j in $(seq 1 30); do
                curl -fsS "http://127.0.0.1:${PORT}/healthz" >/dev/null && break
                sleep 1
              done
              if ! curl -fsS "http://127.0.0.1:${PORT}/healthz" >/dev/null; then
                echo "::error::mock upstream on port ${PORT} failed to start"
                exit 1
              fi
            done
            echo "All ${INSTANCES} runner-local mocks ready on $((BASE_PORT))-$((BASE_PORT + INSTANCES - 1))"
            exit 0
          fi

          # One Deployment + Service per instance, because each carries a different
          # MOCK_FORCE_MODE and the channels must address them individually.
          kubectl create configmap route-unit-mock-src \
            --from-file=mock_upstream.py=tests/route_unit_stress/fixtures/mock_upstream.py \
            --dry-run=client -o yaml | kubectl apply -f -
          for i in $(seq 0 $((INSTANCES - 1))); do
            MODE="${MODES[$i]}"
            kubectl apply -f - <<YAML
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: route-unit-mock-${i}
            labels:
              app: route-unit-mock
              instance: "m${i}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: route-unit-mock
                instance: "m${i}"
            template:
              metadata:
                labels:
                  app: route-unit-mock
                  instance: "m${i}"
              spec:
                containers:
                  - name: mock
                    image: python:3.12-alpine
                    command: ["python", "/mock/mock_upstream.py"]
                    env:
                      - name: MOCK_PORT
                        value: "8099"
                      - name: MOCK_NDJSON
                        value: /tmp/mock_upstream.ndjson
                      - name: MOCK_FORCE_MODE
                        value: "${MODE}"
                    ports:
                      - containerPort: 8099
                    readinessProbe:
                      httpGet:
                        path: /healthz
                        port: 8099
                      initialDelaySeconds: 2
                      periodSeconds: 2
                    volumeMounts:
                      - name: mock-src
                        mountPath: /mock
                        readOnly: true
                    resources:
                      requests:
                        cpu: 100m
                        memory: 128Mi
                      limits:
                        cpu: "1"
                        memory: 512Mi
                volumes:
                  - name: mock-src
                    configMap:
                      name: route-unit-mock-src
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: route-unit-mock-${i}
          spec:
            selector:
              app: route-unit-mock
              instance: "m${i}"
            ports:
              - port: 80
                targetPort: 8099
          YAML
            # Restart so a re-run picks up the current fixture rather than the
            # ConfigMap contents the pod started with.
            kubectl rollout restart "deployment/route-unit-mock-${i}"
          done

          for i in $(seq 0 $((INSTANCES - 1))); do
            kubectl rollout status "deployment/route-unit-mock-${i}" --timeout=180s
          done

          # /healthz and /_ndjson are read from here; the gateway uses Service DNS.
          # Keep the same ports the runner-local path uses so nothing downstream
          # needs to know which mode produced them.
          for i in $(seq 0 $((INSTANCES - 1))); do
            PORT=$((BASE_PORT + i))
            kubectl port-forward "service/route-unit-mock-${i}" "${PORT}:80" \
              > "/tmp/mock-pf-${PORT}.log" 2>&1 &
            echo "MOCK_PF_PID_${PORT}=$!" >> "$GITHUB_ENV"
          done
          for i in $(seq 0 $((INSTANCES - 1))); do
            PORT=$((BASE_PORT + i))
            for j in $(seq 1 30); do
              curl -fsS "http://127.0.0.1:${PORT}/healthz" >/dev/null 2>&1 && break
              sleep 1
            done
            if ! curl -fsS "http://127.0.0.1:${PORT}/healthz" >/dev/null 2>&1; then
              echo "::error::port-forward to route-unit-mock-${i} never became ready"
              cat "/tmp/mock-pf-${PORT}.log" || true
              exit 1
            fi
            echo "in-cluster mock ${i} (mode=${MODES[$i]}) reachable on 127.0.0.1:${PORT}"
          done

      - name: Configure mock URL for scenario
        run: |
          set -euo pipefail
          # run_scenario.py takes one --mock-url for /healthz; the ndjson pull walks
          # every instance via --mock-url-extra so multi-instance reconciliation sees
          # all upstream records, not just the first instance's.
          echo "MOCK_URL_PRIMARY=http://127.0.0.1:${MOCK_BASE_PORT}" >> "$GITHUB_ENV"
          EXTRA=""
          for i in $(seq 0 $((MOCK_INSTANCES - 1))); do
            EXTRA="$EXTRA --mock-url-extra http://127.0.0.1:$((MOCK_BASE_PORT + i))"
          done
          echo "MOCK_URL_EXTRA_ARGS=$EXTRA" >> "$GITHUB_ENV"
          echo "mock bases: $EXTRA"

      - name: Point stress channels at the in-cluster mocks
        if: env.MOCK_IN_CLUSTER == 'true'
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MODEL: ${{ env.MODEL }}
        run: |
          set -euo pipefail
          # Reconciliation compares gateway attempts against the mocks this run reads
          # from, so every attempt must land on one of them. Channels left pointing at
          # another upstream yield audit rows with no matching upstream row and the
          # scenario is reported DATA_INVALID.
          POD=$(kubectl get pods -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$POD" ]; then
            echo "::error::no postgres pod found; cannot provision stress channels"
            exit 1
          fi
          # One channel per mock instance, id 91001..9100N, each pointing at its own
          # Service so the scenario's per-instance MOCK_FORCE_MODE actually reaches
          # distinct route units.
          VALUES=""
          for i in $(seq 0 $((MOCK_INSTANCES - 1))); do
            CID=$((91001 + i))
            [ -n "$VALUES" ] && VALUES="$VALUES,"
            VALUES="$VALUES($CID, 1, 'mock', 1, 'route-unit-mock-$i', EXTRACT(EPOCH FROM now())::bigint, 'http://route-unit-mock-$i', '${MODEL}', 'default', 0, '', '', '{\"X-Request-Id\":\"{client_header:X-Request-Id}\"}')"
          done
          LAST=$((91000 + MOCK_INSTANCES))
          kubectl exec -i "$POD" -- env PGPASSWORD="$POSTGRES_PASSWORD" \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<SQL
          DELETE FROM abilities WHERE channel_id BETWEEN 91001 AND 91099;
          DELETE FROM channel_model_routes WHERE channel_id BETWEEN 91001 AND 91099;
          DELETE FROM channels WHERE id BETWEEN 91001 AND 91099;
          INSERT INTO channels (id, type, key, status, name, created_time, base_url, models, "group", auto_ban, other_info, settings, header_override)
          VALUES $VALUES;
          INSERT INTO abilities ("group", model, channel_id, enabled)
          SELECT 'default', '${MODEL}', id, true FROM channels WHERE id BETWEEN 91001 AND $LAST;
          -- Route units are not inserted here: SeedChannelModelRoutes() derives them
          -- from every channel on master startup, and the restart below triggers it.
          SELECT id, name, base_url, models FROM channels WHERE id BETWEEN 91001 AND $LAST;
          SQL
          # Every scenario except S10 wants a single worker: the audit ring is
          # per process and the Service load-balances, so with N replicas the runner
          # reads one pod's buffer and the rest is reported missing_in_audit. S10
          # scales up separately and polls each pod directly.
          if [ -z "${REPLICA:-}" ] || [ "${REPLICA}" = "1" ]; then
            kubectl scale deployment/new-api-worker --replicas=1
          fi
          # Master and worker must not restart together. Only the master seeds route
          # units, and a worker booting alongside it caches whatever pool exists at
          # that moment; if seeding has not finished the worker holds an empty pool for
          # a full SYNC_FREQUENCY (60s) and answers model_not_found.
          kubectl rollout restart deployment/new-api-master
          kubectl rollout status deployment/new-api-master --timeout=300s
          for i in $(seq 1 60); do
            ROUTES=$(kubectl exec -i "$POD" -- env PGPASSWORD="$POSTGRES_PASSWORD" \
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
              "SELECT count(*) FROM channel_model_routes WHERE channel_id BETWEEN 91001 AND $LAST;" | tr -d '[:space:]')
            [ "${ROUTES:-0}" -ge "$MOCK_INSTANCES" ] && break
            sleep 2
          done
          echo "route units for stress channels: ${ROUTES:-0}"
          if [ "${ROUTES:-0}" -lt "$MOCK_INSTANCES" ]; then
            echo "::error::route-unit seeding produced ${ROUTES:-0} rows; expected $MOCK_INSTANCES"
            kubectl exec -i "$POD" -- env PGPASSWORD="$POSTGRES_PASSWORD" \
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -c "SELECT channel_id, \"group\", public_model_alias, upstream_model, static_weight, enabled FROM channel_model_routes WHERE channel_id BETWEEN 91001 AND $LAST;" || true
            exit 1
          fi
          kubectl rollout restart deployment/new-api-worker
          kubectl rollout status deployment/new-api-worker --timeout=420s
          # Readiness only proves /api/status answers; the route pool loads on the same
          # boot path, so confirm the worker resolves the alias before handing over.
          for i in $(seq 1 45); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
              -H "Authorization: Bearer $API_KEY" -H 'Content-Type: application/json' \
              -X POST -d "{\"model\":\"${MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":1}" \
              "${TARGET_URL%/}/chat/completions" || true)
            if [ "$CODE" = "200" ]; then
              echo "worker resolves ${MODEL} (probe HTTP $CODE)"
              break
            fi
            sleep 2
          done
          if [ "${CODE:-}" != "200" ]; then
            echo "::error::worker still cannot route ${MODEL} after restart (last HTTP ${CODE:-none})"
            exit 1
          fi

      - name: Resolve admin token
        id: admin_login_scenario
        env:
          ADMIN_TOKEN: ${{ env.ADMIN_TOKEN }}
          ADMIN_USERNAME: ${{ env.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
          GATEWAY_ADMIN_URL: ${{ env.GATEWAY_ADMIN_URL }}
          TARGET_URL: ${{ env.TARGET_URL }}
        run: |
          set -euo pipefail
          # Empty means "derive from target_url by stripping the /v1 suffix";
          # expressions cannot do string replacement, so it happens here.
          if [ -z "${GATEWAY_ADMIN_URL:-}" ]; then
            GATEWAY_ADMIN_URL="${TARGET_URL%/v1}"
            GATEWAY_ADMIN_URL="${GATEWAY_ADMIN_URL%/}"
          fi
          login_url="${GATEWAY_ADMIN_URL%/}/api/user/login"
          probe_token() {
            curl -fsS --max-time 5 -H "Authorization: Bearer $1" \
              "${GATEWAY_ADMIN_URL%/}/api/route_unit/audit?alias=__probe__&limit=1" >/dev/null 2>&1
          }
          if [ -n "$ADMIN_TOKEN" ] && probe_token "$ADMIN_TOKEN"; then
            echo "Using provided admin token"
            echo "ADMIN_TOKEN_FINAL=$ADMIN_TOKEN" >> "$GITHUB_ENV"
            exit 0
          fi
          for i in $(seq 1 15); do
            RESP=$(curl -fsS --max-time 10 -H 'Content-Type: application/json' \
              -X POST -d "{\"username\":\"$ADMIN_USERNAME\",\"password\":\"$ADMIN_PASSWORD\"}" \
              "$login_url" 2>/dev/null || true)
            if [ -n "$RESP" ]; then
              TOKEN=$(echo "$RESP" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("data",{}).get("access_token",""))' 2>/dev/null || true)
              if [ -n "$TOKEN" ] && probe_token "$TOKEN"; then
                echo "Auto-login admin token obtained (len=${#TOKEN})"
                echo "::add-mask::$TOKEN"
                echo "ADMIN_TOKEN_FINAL=$TOKEN" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
            echo "Login attempt $i failed, retrying..."
            sleep 2
          done
          echo "::error::Failed to obtain admin token from $login_url"
          exit 1

      - name: Preflight gateway
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --connect-timeout 5 -H "Authorization: Bearer $API_KEY" "$TARGET_URL/models" >/dev/null; then
              echo "Gateway reachable"
              exit 0
            fi
            sleep 2
          done
          echo "Gateway not reachable at $TARGET_URL" >&2
          exit 1

      - name: Verify affinity setting
        run: |
          set -euo pipefail
          if [ "${{ env.ALLOW_AFFINITY }}" != "true" ]; then
            # Check if channel_affinity_setting.enabled is true via admin API
            # For now, just warn; runner enforces ENVIRONMENT_INVALID
            echo "Warning: channel_affinity_setting.enabled must be false. Runner will fail with ENVIRONMENT_INVALID if enabled."
          fi

      - name: Scale gateway replicas
        id: replicas
        run: |
          set -euo pipefail
          # The replica input must change the deployment, not merely be forwarded
          # to the runner. Without that, a "dual-replica" claim is unfounded.
          REPLICA="${REPLICA:-}"
          if [ -z "$REPLICA" ] || [ "$REPLICA" = "1" ]; then
            echo "replica not set or 1: single-instance run"
            echo "REPLICA_URLS=" >> "$GITHUB_ENV"
            echo "REPLICA_APPLIED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! command -v kubectl >/dev/null 2>&1 || [ ! -f ~/.kube/config ]; then
            echo "::error::replica=$REPLICA requested but kubectl/kubeconfig unavailable; cannot scale the deployment. Refusing to report a multi-replica run that did not happen."
            exit 1
          fi
          DEPLOY="${K8S_DEPLOYMENT:-new-api}"
          NS="${K8S_NAMESPACE:-default}"
          kubectl -n "$NS" scale deployment/"$DEPLOY" --replicas="$REPLICA"
          kubectl -n "$NS" rollout status deployment/"$DEPLOY" --timeout=300s
          READY=$(kubectl -n "$NS" get deployment/"$DEPLOY" -o jsonpath='{.status.readyReplicas}')
          echo "readyReplicas=$READY (requested $REPLICA)"
          if [ "$READY" != "$REPLICA" ]; then
            echo "::error::deployment reports readyReplicas=$READY, expected $REPLICA"
            exit 1
          fi
          # Record pod identity: #418 requires per-pod evidence, and each replica
          # keeps its own in-process share window, so the runner must poll each.
          kubectl -n "$NS" get pods -l app="$DEPLOY" -o json > /tmp/replica-pods.json
          kubectl -n "$NS" get pods -l app="$DEPLOY" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.podIP}{"\n"}{end}' | tee /tmp/replica-pods.txt
          URLS=""
          while IFS=$'\t' read -r name ip; do
            [ -z "$ip" ] && continue
            URLS="$URLS --replica-url http://$ip:3000"
          done < /tmp/replica-pods.txt
          echo "REPLICA_URLS=$URLS" >> "$GITHUB_ENV"
          echo "REPLICA_APPLIED=$READY" >> "$GITHUB_ENV"
          # Surface pod identity + readyReplicas in the run summary: a "dual-replica"
          # claim without per-pod evidence is the exact failure #418 forbids.
          {
            echo "## Replica Deployment"
            echo ""
            echo "| requested | readyReplicas |"
            echo "|-----------|---------------|"
            echo "| $REPLICA | $READY |"
            echo ""
            echo "| pod | podIP |"
            echo "|-----|-------|"
            while IFS=$'\t' read -r name ip; do
              echo "| $name | $ip |"
            done < /tmp/replica-pods.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run scenario ${{ matrix.scenario }}
        id: scenario
        env:
          # In-cluster the records live in the mock pods, so leave this unset and let
          # the runner pull them from each instance's /_ndjson over the port-forwards.
          # Runner-local runs share the file and read it directly.
          MOCK_NDJSON: ${{ env.MOCK_IN_CLUSTER == 'true' && '' || '/tmp/mock_upstream.ndjson' }}
        run: |
          set -euo pipefail
          python3 tests/route_unit_stress/run_scenario.py \
            --scenario ${{ matrix.scenario }} \
            --gateway-url "$TARGET_URL" \
            --token "$API_KEY" \
            --admin-token "${{ env.ADMIN_TOKEN_FINAL }}" \
            --alias "${{ env.ALIAS }}" \
            --mock-url "${MOCK_URL_PRIMARY:-$MOCK_URL}" \
            ${MOCK_URL_EXTRA_ARGS:-} \
            ${{
              (startsWith(matrix.scenario, 'S6') || startsWith(matrix.scenario, 'S7') || startsWith(matrix.scenario, 'S8') || startsWith(matrix.scenario, 'S13'))
              && '' || format('--requests {0}', env.REQUESTS)
            }} \
            --warmup ${{ env.WARMUP }} \
            --concurrency ${{ env.CONCURRENCY }} \
            ${{
              env.STREAM_RATIO != '' && format('--stream-ratio {0}', env.STREAM_RATIO) || ''
            }} \
            ${{
              (env.ALLOW_AFFINITY == 'true' || startsWith(matrix.scenario, 'S9')) && '--allow-affinity' || ''
            }} \
            ${{
              env.ROUTE_COUNT != '' && format('--route-count {0}', env.ROUTE_COUNT) || ''
            }} \
            ${{
              env.BAD_CHANNEL_ID != '' && format('--bad-channel-id {0}', env.BAD_CHANNEL_ID) || ''
            }} \
            ${{
              env.SHARE_WINDOW_SIZE != '' && format('--share-window-size {0}', env.SHARE_WINDOW_SIZE) || ''
            }} \
            ${{
              env.REPLICA != '' && format('--replica {0}', env.REPLICA) || ''
            }} \
            $REPLICA_URLS \
            ${{
              env.SPECIFIC_CHANNEL_ID != '' && format('--specific-channel-id {0}', env.SPECIFIC_CHANNEL_ID) || ''
            }} \
            ${{
              startsWith(matrix.scenario, 'S13') && format('--fault-hook {0} --recover-hook {1}', env.FAULT_HOOK, env.RECOVER_HOOK) || ''
            }} \
            ${{
              env.ENABLE_PPROF == 'true' && format('--pprof-url {0}', env.PPROF_URL) || ''
            }} \
            --out-dir runtime/${{ matrix.scenario }}-${{ github.run_id }}
        continue-on-error: true

      - name: Upload scenario artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-unit-${{ matrix.scenario }}-${{ github.run_id }}
          path: runtime/${{ matrix.scenario }}-*
          retention-days: 14

      - name: Scenario summary
        if: always()
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          SUMMARY_FILE="runtime/${{ matrix.scenario }}-${{ github.run_id }}/summary.json"
          if [ -f "$SUMMARY_FILE" ]; then
            python3 - "$SUMMARY_FILE" << 'PYEOF'
          import json, os, sys
          summary_path = sys.argv[1]
          scenario = os.environ["SCENARIO"]
          run_id = os.environ["GITHUB_RUN_ID"]
          with open(summary_path) as f:
              s = json.load(f)

          verdict = s.get("verdict", "N/A")
          cfg = s.get("config", {})
          rec = s.get("reconcile", {})
          shares = s.get("shares", [])
          share_eval = s.get("share_eval", {})
          sq = s.get("service_quality", {})
          res = s.get("resources", {})
          reasons = s.get("reasons", [])

          lines = []
          lines.append(f"## Route Unit EWMA Stress - {scenario} (Run {run_id})")
          lines.append("")
          lines.append("| Metric | Value |")
          lines.append("|--------|-------|")
          lines.append(f"| Scenario | {scenario} |")
          lines.append(f"| Verdict | {verdict} |")
          lines.append(f"| Required Samples | {cfg.get('requests', 'N/A')} |")
          lines.append(f"| Actual Samples | {rec.get('matched_pairs', 0)} |")
          lines.append(f"| Reconciliation | {rec.get('verdict', 'N/A')} |")
          lines.append(f"| Missing in Audit | {len(rec.get('missing_in_audit', []))} |")
          lines.append(f"| Missing in Mock | {len(rec.get('missing_in_mock', []))} |")
          lines.append(f"| Identity Mismatches | {len(rec.get('identity_mismatch', []))} |")
          lines.append(f"| Attempt Gaps | {len(rec.get('attempt_gaps', []))} |")
          lines.append("")

          # Subject route share evaluation
          subject_routes = [sh for sh in shares if sh.get("route") == cfg.get("alias", "")]
          if subject_routes:
              sr = subject_routes[0]
              eval_r = share_eval.get(sr.get("route", ""), {})
              eval_str = "OK" if eval_r.get("ok") else f"FAIL: {', '.join(eval_r.get('reasons', []))}"
              lines.append("### Subject Route Share Evaluation")
              lines.append("")
              lines.append("| Route | Observed Share | CI Low | CI High | Target | Tol pp | Eval |")
              lines.append("|-------|----------------|--------|---------|--------|---------|------|")
              target = sr.get("target")
              tol = sr.get("tol_pp")
              target_str = f"{target:.3f}" if target is not None else "n/a"
              tol_str = f"{tol:.3f}" if tol is not None else "n/a"
              lines.append(f"| {sr.get('route', '')} | {sr.get('observed_share', 0):.4f} | {sr.get('ci_low', 0):.4f} | {sr.get('ci_high', 0):.4f} | {target_str} | {tol_str} | {eval_str} |")
              lines.append("")

          # --- S4: 429 counts, Retry-After distribution, throttle_only_share comparison ---
          if scenario.startswith("S4"):
              lines.append("### S4 Throttling Analysis")
              lines.append("")
              lines.append("| Metric | Value |")
              lines.append("|--------|-------|")
              throttle_only = cfg.get("throttle_only_share")
              throttle_str = f"{throttle_only:.4f}" if throttle_only is not None else "N/A"
              lines.append(f"| throttle_only_share (q/(1+q)=0.4118) | {throttle_str} |")
              lines.append(f"| Observed subject share | {sr.get('observed_share', 0):.4f} |")
              lines.append(f"| Target (Retry-After in TTFT) | {target_str if target else 'N/A'} |")
              rate_429 = sq.get("status_429", rec.get("status_429", 0))
              lines.append(f"| 429 responses | {rate_429} |")
              retry_after_dist = s.get("retry_after_distribution", {})
              if retry_after_dist:
                  lines.append("")
                  lines.append("#### Retry-After Header Distribution")
                  lines.append("")
                  lines.append("| Retry-After | Count |")
                  lines.append("|-------------|-------|")
                  for k, v in sorted(retry_after_dist.items()):
                      lines.append(f"| {k} | {v} |")
                  lines.append("")
              lines.append("")
              lines.append("> If observed ~ throttle_only_share (0.4118) instead of target (0.38), Retry-After is NOT counted in TTFT -> PRODUCT_FAIL.")
              lines.append("")

          # --- S5: per-route healthy shares and total ---
          if scenario.startswith("S5"):
              lines.append("### S5 Pool Route Shares")
              lines.append("")
              lines.append("| Route | Label | Observed Share | Target | Eval |")
              lines.append("|------|-------|----------------|--------|------|")
              total_healthy = 0.0
              for sh in shares:
                  eval_r = share_eval.get(sh.get("route", ""), {})
                  eval_str = "OK" if eval_r.get("ok") else "FAIL"
                  obs = sh.get("observed_share", 0)
                  lbl = sh.get("label", sh.get("route", ""))
                  tgt = sh.get("target")
                  tgt_str = f"{tgt:.4f}" if tgt is not None else "n/a"
                  lines.append(f"| {sh.get('route', '')} | {lbl} | {obs:.4f} | {tgt_str} | {eval_str} |")
                  if lbl != "BAD":
                      total_healthy += obs
              lines.append(f"| **Total healthy** | | **{total_healthy:.4f}** | | |")
              lines.append("")
              lines.append(f"> Pool size: {cfg.get('route_count', 'N/A')} routes under same alias; BAD route target={target_str if target else 'N/A'}.")
              lines.append("")

          # --- S6: process stability ---
          if scenario.startswith("S6"):
              ps = s.get("process_stability", {})
              if ps:
                  lines.append("### S6 Process Stability")
                  lines.append("")
                  lines.append("| Metric | Value | Threshold |")
                  lines.append("|--------|-------|-----------|")
                  lines.append(f"| Verdict | {'OK' if ps.get('ok') else 'FAIL'} | |")
                  lines.append(f"| corr_p99 headroom | {ps.get('corr_p99_headroom', 0):.4f} | >0.20 |")
                  lines.append(f"| share stddev (pp) | {ps.get('share_stddev_pp', 0):.4f} | <={cfg.get('process_thresholds', {}).get('share_stddev_max_pp', 'N/A')} |")
                  lines.append(f"| max consecutive breach | {ps.get('max_consecutive_breach', 0)} | <={cfg.get('process_thresholds', {}).get('consecutive_breach_max', 'N/A')} |")
                  lines.append(f"| insufficient windows | {ps.get('insufficient_windows', 0)} | |")
                  lines.append(f"| window samples (min) | {ps.get('min_window_samples', 'N/A')} | >={cfg.get('process_thresholds', {}).get('min_window_samples', 'N/A')} |")
                  lines.append("")
                  ps_reasons = ps.get("reasons", [])
                  if ps_reasons:
                      lines.append("#### Stability Reasons")
                      lines.append("")
                      for r in ps_reasons:
                          lines.append(f"- {r}")
                      lines.append("")
              lines.append(f"> Window size: {cfg.get('share_window_size', 'N/A')} | Step at {cfg.get('step_at_ratio', 'N/A')} of progress | Min tail: {cfg.get('min_tail_seconds', 'N/A')}s")
              lines.append("")

          # --- S7: corr headroom ---
          if scenario.startswith("S7"):
              ce = s.get("corr_evaluation", {})
              if ce:
                  lines.append("### S7 Corr Headroom")
                  lines.append("")
                  lines.append("| Metric | Value |")
                  lines.append("|--------|-------|")
                  lines.append(f"| Verdict | {'OK' if ce.get('ok') else 'FAIL'} |")
                  lines.append(f"| corr p99 | {ce.get('corr_p99', 0):.3f} |")
                  lines.append(f"| corr min | {ce.get('corr_min', 0):.3f} |")
                  lines.append(f"| corr max | {ce.get('corr_max', 0):.3f} |")
                  lines.append(f"| corr p50 | {ce.get('corr_p50', 0):.3f} |")
                  lines.append(f"| corr p95 | {ce.get('corr_p95', 0):.3f} |")
                  lines.append(f"| headroom | {ce.get('headroom', 0):.2%} |")
                  lines.append(f"| total snapshots | {ce.get('total_snapshots', 0)} |")
                  prc = ce.get("per_route_counts", {})
                  if prc:
                      lines.append(f"| per-route counts | {prc} |")
                  lines.append("")
                  ce_reasons = ce.get("reasons", [])
                  if ce_reasons:
                      lines.append("#### Reasons")
                      lines.append("")
                      for r in ce_reasons:
                          lines.append(f"- {r}")
                      lines.append("")
              lines.append(f"> Window size: {cfg.get('share_window_size', 'N/A')}")
              lines.append("")

          # --- S8: memory scaling ---
          if scenario.startswith("S8"):
              me = s.get("memory_evaluation", {})
              if me:
                  lines.append("### S8 Memory Scaling")
                  lines.append("")
                  lines.append("| Metric | Value |")
                  lines.append("|--------|-------|")
                  lines.append(f"| Verdict | {'OK' if me.get('ok') else 'FAIL'} |")
                  lines.append(f"| heap baseline | {me.get('heap_baseline', 'N/A')} |")
                  lines.append(f"| heap peak | {me.get('heap_peak', 'N/A')} |")
                  lines.append(f"| heap post-sweep | {me.get('heap_post_sweep', 'N/A')} |")
                  lines.append(f"| RSS peak | {me.get('rss_peak', 'N/A')} |")
                  lines.append(f"| pool count peak | {me.get('pool_count_peak', 0)} |")
                  lines.append(f"| pool count == active | {me.get('active_pool_match', False)} |")
                  lines.append(f"| monotonic growth | {me.get('monotonic_growth', False)} |")
                  lines.append("")
                  me_reasons = me.get("reasons", [])
                  if me_reasons:
                      lines.append("#### Reasons")
                      lines.append("")
                      for r in me_reasons:
                          lines.append(f"- {r}")
                      lines.append("")
              lines.append(f"> Scale: {cfg.get('scale', 'N/A')} | Duration: {cfg.get('steady_duration_s', 'N/A')}s")
              lines.append("")

          # --- S9: affinity scan ---
          if scenario.startswith("S9"):
              s9 = s.get("s9_result", {})
              if s9:
                  lines.append("### S9 Affinity Scan")
                  lines.append("")
                  lines.append("| Metric | Value |")
                  lines.append("|--------|-------|")
                  lines.append(f"| affinity ratio | {s9.get('affinity_ratio', 0):.0%} |")
                  lines.append(f"| window size | {s9.get('window_size', 0)} |")
                  lines.append(f"| A share | {s9.get('A_share', 0):.4f} |")
                  lines.append(f"| A CI | [{s9.get('A_ci_low', 0):.4f}, {s9.get('A_ci_high', 0):.4f}] |")
                  lines.append(f"| A selections | {s9.get('A_selections', 0)} |")
                  lines.append("")

          # --- S10: global share re-aggregation + kill switch ---
          if scenario.startswith("S10"):
              gs = s.get("global_share", {})
              if gs:
                  lines.append("### S10 Global Share (re-aggregated from raw attempts)")
                  lines.append("")
                  lines.append("| Metric | Value |")
                  lines.append("|--------|-------|")
                  lines.append(f"| global share | {gs.get('global_share', 0):.4f} |")
                  lines.append(f"| global selections | {gs.get('global_selections', 0)} |")
                  lines.append(f"| global attempts | {gs.get('global_total', 0)} |")
                  lines.append(f"| pods seen | {gs.get('pods_seen', [])} |")
                  lines.append("")
                  per_pod = gs.get("per_pod", {})
                  if per_pod:
                      lines.append("| Pod | Selections | Attempts | Pod share (reporting only) |")
                      lines.append("|-----|-----------|----------|----------------------------|")
                      for pod, b in sorted(per_pod.items()):
                          lines.append(f"| {pod} | {b.get('selections', 0)} | {b.get('total', 0)} | {b.get('share', 0):.4f} |")
                      lines.append("")
                      lines.append("> Per-pod shares are reporting only. The verdict uses the pooled global share; averaging pod percentages is forbidden by #418.")
                      lines.append("")
              ks = s.get("kill_switch_evaluation", {})
              if ks:
                  lines.append("#### Kill Switch")
                  lines.append("")
                  lines.append("| Check | Result |")
                  lines.append("|-------|--------|")
                  lines.append(f"| option persisted false | {ks.get('option_persisted')} |")
                  lines.append(f"| corrections neutral (1.0) | {ks.get('corrections_neutral')} |")
                  lines.append(f"| window stopped allocating | {ks.get('window_stopped')} |")
                  lines.append(f"| restart observed | {ks.get('restarted')} |")
                  lines.append("")
                  for r in ks.get("reasons", []):
                      lines.append(f"- {r}")
                  lines.append("")

          # --- S11: path audit ---
          if scenario.startswith("S11"):
              pa = s.get("path_audit", {})
              if pa:
                  lines.append("### S11 Path Audit")
                  lines.append("")
                  lines.append("| Check | Result |")
                  lines.append("|-------|--------|")
                  lines.append(f"| verdict | {'OK' if pa.get('ok') else 'FAIL'} |")
                  lines.append(f"| attempts per path | {pa.get('per_path_counts', {})} |")
                  lines.append(f"| unlabelled attempts | {pa.get('unlabelled', 0)} |")
                  lines.append(f"| incomplete quadruples | {len(pa.get('incomplete_quadruples', []))} |")
                  lines.append(f"| probe isolated (opportunity_count=0) | {pa.get('probe_isolated')} |")
                  lines.append(f"| bypass entered window | {pa.get('bypass_in_window')} |")
                  lines.append(f"| probes sent | {s.get('s11_probes_sent', 0)} |")
                  lines.append(f"| window paths | {s.get('s11_window_paths', [])} |")
                  lines.append("")
                  for r in pa.get("reasons", []):
                      lines.append(f"- {r}")
                  lines.append("")

          # --- S12: retry attribution ---
          if scenario.startswith("S12"):
              ra = s.get("retry_attribution", {})
              if ra:
                  lines.append("### S12 Retry Attribution")
                  lines.append("")
                  lines.append("| Metric | Value |")
                  lines.append("|--------|-------|")
                  lines.append(f"| attribution | {ra.get('attribution')} |")
                  lines.append(f"| failed attempt reached quality | {ra.get('quality_observed')} |")
                  lines.append(f"| failed attempt reached window | {ra.get('window_observed')} |")
                  lines.append(f"| EWMA delta | {ra.get('ewma_delta', 0):.4f} |")
                  lines.append(f"| attempt failure rate | {ra.get('attempt_failure_rate', 0):.4f} |")
                  lines.append(f"| user failure rate | {ra.get('user_failure_rate', 0):.4f} |")
                  lines.append(f"| RetryTimes applied | {s.get('retry_times_applied')} |")
                  lines.append("")
                  for r in ra.get("reasons", []):
                      lines.append(f"- {r}")
                  lines.append("")
                  lines.append("> 'neither' means a persistently failing route can never be de-weighted (PRODUCT_FAIL).")
                  lines.append("")

          # --- S13: degradation and recovery ---
          if scenario.startswith("S13"):
              re_ = s.get("recovery_evaluation", {})
              if re_:
                  lines.append("### S13 Degradation and Recovery")
                  lines.append("")
                  lines.append("| Metric | Value |")
                  lines.append("|--------|-------|")
                  lines.append(f"| verdict | {'OK' if re_.get('ok') else 'FAIL'} |")
                  lines.append(f"| corr inside [0.5, 2.0] | {re_.get('corr_in_clamp')} |")
                  lines.append(f"| corr violations | {len(re_.get('corr_violations', []))} |")
                  lines.append(f"| degradation observed | {re_.get('degradation_observed')} |")
                  lines.append(f"| steady share | {re_.get('steady_share')} |")
                  lines.append(f"| fault share | {re_.get('fault_share')} |")
                  lines.append(f"| post-recovery share | {re_.get('post_recovery_share')} |")
                  lines.append(f"| recovered | {re_.get('recovered')} |")
                  lines.append(f"| recovery seconds | {re_.get('recovery_seconds')} |")
                  lines.append("")
                  for r in re_.get("reasons", []):
                      lines.append(f"- {r}")
                  lines.append("")
                  lines.append("> Isolation is per-route with no cross-route cascade, and calm/dormant routes stay selectable at reduced weight: this measures weight degradation and recovery, not an emptied candidate pool.")
                  lines.append("")

          # Service quality
          lines.append("### Service Quality")
          lines.append("")
          lines.append("| Metric | Value |")
          lines.append("|--------|-------|")
          for k, v in sq.items():
              if v is not None:
                  if isinstance(v, float):
                      lines.append(f"| {k} | {v:.2f} |")
                  else:
                      lines.append(f"| {k} | {v} |")
              else:
                  lines.append(f"| {k} | N/A |")
          lines.append("")

          # Resource peaks
          lines.append("### Resource Peaks (10s windows)")
          lines.append("")
          lines.append("| Metric | Peak |")
          lines.append("|--------|------|")
          peak_cpu = res.get("peak_cpu_user")
          peak_rss = res.get("peak_rss")
          peak_disk = res.get("peak_disk_write_bps")
          peak_net_err = res.get("peak_net_error")
          cpu_str = f"{peak_cpu:.2f}" if peak_cpu is not None else "N/A"
          rss_str = str(peak_rss) if peak_rss is not None else "N/A"
          disk_str = str(peak_disk) if peak_disk is not None else "N/A"
          net_str = str(peak_net_err) if peak_net_err is not None else "N/A"
          lines.append(f"| CPU User % | {cpu_str} |")
          lines.append(f"| RSS (bytes) | {rss_str} |")
          lines.append(f"| Disk Write (B/s) | {disk_str} |")
          lines.append(f"| Net Errors | {net_str} |")
          lines.append("")

          # K8s / replica context (Task 4 + Task 6): per-pod evidence and sweep
          # KNOWN LIMITATION must be visible, not buried in summary.json.
          lines.append("### Replica / K8s")
          lines.append("")
          lines.append("| Field | Value |")
          lines.append("|-------|-------|")
          lines.append(f"| replica (requested) | {cfg.get('replica', 'N/A')} |")
          lines.append(f"| replica_urls | {cfg.get('replica_urls', 'N/A')} |")
          lines.append(f"| replica_count_effective | {cfg.get('replica_count_effective', 'N/A')} |")
          k8s_val = res.get("k8s", "NOT_AVAILABLE")
          lines.append(f"| k8s pod/node | {k8s_val} |")
          if s.get("s10_sweep_known_limitation"):
              lines.append("| sweep | KNOWN LIMITATION (ticker is time.Hour; short run cannot trigger) |")
          lines.append("")

          # Verdict details
          if reasons:
              lines.append("### Verdict Details")
              lines.append("")
              for r in reasons:
                  lines.append(f"- {r}")
              lines.append("")

          # Artifact links
          lines.append("### Artifacts")
          lines.append("")
          lines.append(f"- `route-unit-{scenario.lower()}-{run_id}` (download from Actions artifacts)")
          lines.append("")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines))
          PYEOF
          else
            echo "No summary.json found for ${{ matrix.scenario }}" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fail job on non-zero exit
        if: always()
        run: |
          # Both exit code 1 (DATA_INVALID/UNDERPOWERED/PRODUCT_FAIL) and 2 (ENVIRONMENT_INVALID) fail the job
          # Artifacts already uploaded via always() step above
          exit ${{ steps.scenario.outcome == 'success' && 0 || 1 }}

      - name: Cleanup mock
        if: always()
        run: |
          for var in $(env | grep -E '^MOCK_(PID|PF_PID)_' | cut -d= -f1); do
            pid="${!var}"
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null || true
            fi
          done
          # Leave the cluster as found: the mock Deployments and the stress channels
          # would otherwise keep serving traffic and skew any later run.
          if [ "${MOCK_IN_CLUSTER:-}" = "true" ]; then
            kubectl delete deployment,service -l app=route-unit-mock --ignore-not-found=true || true
            kubectl delete configmap/route-unit-mock-src --ignore-not-found=true || true
          fi