name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pre-pull base images with retry
        run: |
          for img in $(grep '^FROM ' Dockerfile | awk '{print $2}'); do
            ok=0
            for i in 1 2 3; do
              echo "Pulling $img (attempt $i)..."
              if docker pull "$img"; then
                ok=1
                break
              fi
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "Failed to pull $img after 3 attempts"
              exit 1
            fi
          done

      - name: Build the Docker image
        run: |
          ok=0
          for i in 1 2 3; do
            echo "Building (attempt $i)..."
            if docker build . --file Dockerfile --tag my-image-name:$(date +%s); then
              ok=1
              break
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "Docker build failed after 3 attempts"
            exit 1
          fi