name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOCKER_BUILD_PLATFORM: linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pre-pull base images with retry
        run: |
          for img in $(grep '^FROM ' Dockerfile | awk '{print $2}'); do
            for i in 1 2 3; do
              echo "Pulling $img (attempt $i)..."
              docker pull "$img" && break || {
                echo "Attempt $i failed, retrying in 10s..."
                sleep 10
              }
            done
          done

      - name: Build the Docker image
        run: |
          for i in 1 2 3; do
            echo "Building (attempt $i)..."
            docker build . --file Dockerfile --tag my-image-name:$(date +%s) && break || {
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            }
          done
