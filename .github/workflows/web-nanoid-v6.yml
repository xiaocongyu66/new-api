name: Web nanoid v6

on:
  push:
    branches: [codex/upgrade-nanoid-v6-ci]
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-nanoid-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web install, test, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      - name: Generate routes
        run: bun run generate:routes

      - name: Run focused nanoid call-site test
        run: bun test src/features/playground/lib/message/message-utils.test.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
      - name: Check bundle budgets
        run: node scripts/check-bundle-budget.mjs
