name: State Machine Stress Test Matrix

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Run all or one #392 scenario'
        required: true
        type: choice
        default: all
        options: [all, '1', '2', '3', '4', '5', '6', '7', '8']
      target_url:
        description: 'Gateway /v1 URL; NodePort or Ingress'
        required: false
        type: string
        default: 'http://136.0.34.25:30080/v1'
      api_key:
        description: 'Optional bearer key; default is K8S_STRESS_API_KEY secret'
        required: false
        type: string
      model:
        description: 'Model override; empty uses scenario default'
        required: false
        default: ''
        type: string
      vus:
        description: 'Virtual users override'
        required: false
        default: ''
        type: string
      duration:
        description: 'Duration override'
        required: false
        default: ''
        type: string
      k8s_image_tag:
        description: 'Optional gateway image tag'
        required: false
        default: ''
        type: string
      rollback_after_test:
        description: 'Rollback gateway image after testing'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  state-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NAMESPACE: default
      TARGET_URL: ${{ inputs.target_url }}
      API_KEY: ${{ inputs.api_key || secrets.K8S_STRESS_API_KEY }}
      SCENARIO: ${{ inputs.scenario }}
      MODEL_OVERRIDE: ${{ inputs.model }}
      VUS_OVERRIDE: ${{ inputs.vus }}
      DURATION_OVERRIDE: ${{ inputs.duration }}
      IMAGE_TAG: ${{ inputs.k8s_image_tag }}
      ROLLBACK: ${{ inputs.rollback_after_test }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo '${{ secrets.KUBE_CONFIG_B64 }}' | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: 0.52.0
      - name: Mask key and capture images
        run: |
          echo "::add-mask::$API_KEY"
          mkdir -p runtime/perf runtime/logs
          kubectl get deployment/new-api-master -o jsonpath='{.spec.template.spec.containers[?(@.name=="new-api")].image}' > runtime/logs/master-image-before.txt
          kubectl get deployment/new-api-worker -o jsonpath='{.spec.template.spec.containers[?(@.name=="new-api")].image}' > runtime/logs/worker-image-before.txt
      - name: Deploy stress mock
        run: |
          kubectl create configmap state-machine-mock --from-file=mock-upstream.py=tests/perf/fixtures/mock-upstream.py --dry-run=client -o yaml | kubectl apply -f -
          cat <<'YAML' | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata: {name: stress-mock}
          spec:
            replicas: 1
            selector: {matchLabels: {app: stress-mock}}
            template:
              metadata: {labels: {app: stress-mock}}
              spec:
                containers:
                  - name: mock
                    image: python:3.12-alpine
                    command: [python3, /mock/mock-upstream.py]
                    ports: [{containerPort: 8099}]
                    volumeMounts: [{name: source, mountPath: /mock}]
                volumes: [{name: source, configMap: {name: state-machine-mock}}]
          ---
          apiVersion: v1
          kind: Service
          metadata: {name: stress-mock}
          spec:
            selector: {app: stress-mock}
            ports: [{port: 80, targetPort: 8099}]
          YAML
          kubectl rollout status deployment/stress-mock --timeout=180s
      - name: Seed test topology and unlimited quota
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          STRESS_API_KEY: ${{ secrets.K8S_STRESS_API_KEY }}
        run: |
          set -euo pipefail
          pod=$(kubectl get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          token_key="${STRESS_API_KEY#sk-}"
          kubectl exec -i "$pod" -- env PGPASSWORD="$POSTGRES_PASSWORD" psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<SQL
          UPDATE users SET quota=2147483647, used_quota=0 WHERE id=1;
          UPDATE tokens SET status=1, remain_quota=2147483647, unlimited_quota=true, used_quota=0, expired_time=-1, "group"='default' WHERE key='$token_key';
          INSERT INTO options (key,value) VALUES ('RetryTimes','5') ON CONFLICT(key) DO UPDATE SET value='5';
          DELETE FROM abilities WHERE channel_id BETWEEN 90001 AND 90003;
          DELETE FROM channels WHERE id BETWEEN 90001 AND 90003;
          INSERT INTO channels (id,type,key,status,name,weight,created_time,base_url,models,"group",priority,auto_ban,channel_info)
          VALUES
            (90001,1,E'bad-key\ngood-key',1,'state-matrix-keyed',100,extract(epoch from now())::bigint,'http://stress-mock','mock-fast,mock-slow,mock-flaky,mock-bad,mock-recover,mock-weighted','default',0,1,'{"is_multi_key":true,"multi_key_size":2,"multi_key_mode":"polling"}'),
            (90002,1,'good-key',1,'state-matrix-calm',50,extract(epoch from now())::bigint,'http://stress-mock','mock-fast,mock-slow,mock-flaky,mock-bad,mock-recover,mock-weighted','default',0,1,'{"is_multi_key":false}'),
            (90003,1,'good-key',1,'state-matrix-dormant',10,extract(epoch from now())::bigint,'http://stress-mock','mock-fast,mock-slow,mock-flaky,mock-bad,mock-recover,mock-weighted','default',0,1,'{"is_multi_key":false}');
          INSERT INTO abilities ("group",model,channel_id,enabled,priority,weight)
          SELECT 'default',m,90000+n,true,0,w FROM (VALUES (1,100),(2,50),(3,10)) AS c(n,w) CROSS JOIN (VALUES ('mock-fast'),('mock-slow'),('mock-flaky'),('mock-bad'),('mock-recover'),('mock-weighted')) AS v(m);
          SQL
          kubectl rollout restart deployment/new-api-master deployment/new-api-worker
          kubectl rollout status deployment/new-api-master --timeout=300s
          kubectl rollout status deployment/new-api-worker --timeout=300s
      - name: Deploy gateway image
        if: env.IMAGE_TAG != ''
        run: |
          image="ghcr.io/${{ github.repository }}:$IMAGE_TAG"
          kubectl set image deployment/new-api-master new-api="$image"
          kubectl set image deployment/new-api-worker new-api="$image"
          kubectl rollout status deployment/new-api-master --timeout=300s
          kubectl rollout status deployment/new-api-worker --timeout=300s
      - name: Resolve gateway target
        run: |
          if ! curl -fsS --connect-timeout 5 -H "Authorization: Bearer $API_KEY" "$TARGET_URL/models" >/dev/null; then
            (while true; do kubectl port-forward svc/new-api 18080:80 >> runtime/logs/port-forward.log 2>&1 || true; sleep 1; done) &
            echo $! > runtime/logs/port-forward-supervisor.pid
            for i in $(seq 1 45); do
              if curl -fsS http://127.0.0.1:18080/api/status >/dev/null; then
                echo 'TARGET_URL=http://127.0.0.1:18080/v1' >> "$GITHUB_ENV"
                exit 0
              fi
              sleep 1
            done
            exit 1
          fi
      - name: Verify gateway
        run: |
          curl --fail --silent --show-error -H "Authorization: Bearer $API_KEY" "$TARGET_URL/models" > runtime/perf/models.json
      - name: Refresh seeded gateway routing
        run: |
          pod=$(kubectl get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -i "$pod" -- env PGPASSWORD="$POSTGRES_PASSWORD" psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
          TRUNCATE TABLE abilities;
          INSERT INTO abilities ("group", model, channel_id, enabled, priority, weight)
          SELECT split_part(c."group", ',', 1), trim(m.model), c.id, true, c.priority, c.weight
          FROM channels c
          CROSS JOIN LATERAL unnest(string_to_array(c.models, ',')) AS m(model)
          WHERE c.status = 1;
          SQL
          kubectl rollout restart deployment/new-api-master deployment/new-api-worker
          kubectl rollout status deployment/new-api-master --timeout=300s
          kubectl rollout status deployment/new-api-worker --timeout=300s
          kubectl get pods -l app=new-api -o wide > runtime/logs/pods-after-routing-refresh.txt
      - name: Run full scenario matrix
        run: |
          set +e
          if [ "$SCENARIO" = all ]; then scenarios="1 2 3 4 5 6 7 8"; else scenarios="$SCENARIO"; fi
          overall=0
          for n in $scenarios; do
            case "$n" in
              1) script=pool-soft-derating.js; alias=pool-pressure; model=mock-flaky; vus=50; duration=120s;;
              2) script=cas-contention.js; alias=cas-contention; model=mock-flaky; vus=50; duration=120s;;
              3) script=bad-key-cascade.js; alias=bad-key-cascade; model=mock-bad; vus=20; duration=120s;;
              4) script=recovery-decay.js; alias=gray-failure; model=mock-recover; vus=30; duration=120s;;
              5) script=pool-pressure.js; alias=pool-pressure; model=mock-flaky; vus=50; duration=120s;;
              6) script=gray-failure.js; alias=gray-failure; model=mock-flaky; vus=50; duration=120s;;
              7) script=weight-distribution.js; alias=weight-distribution; model=mock-weighted; vus=100; duration=120s;;
              8) script=timeout-classification.js; alias=timeout-classification; model=mock-slow; vus=30; duration=120s;;
            esac
            [ -n "$MODEL_OVERRIDE" ] && model="$MODEL_OVERRIDE"
            [ -n "$VUS_OVERRIDE" ] && vus="$VUS_OVERRIDE"
            [ -n "$DURATION_OVERRIDE" ] && duration="$DURATION_OVERRIDE"
            ensure_gateway() {
              for i in $(seq 1 30); do
                curl -fsS --connect-timeout 5 -H "Authorization: Bearer $API_KEY" "$TARGET_URL/models" >/dev/null && return 0
                sleep 1
              done
              return 1
            }
            ensure_gateway || { overall=1; continue; }
            dir="runtime/perf/scenario-$n"; mkdir -p "$dir"
            k6 run --vus "$vus" --duration "$duration" -e TARGET_URL="$TARGET_URL" -e API_KEY="$API_KEY" -e MODEL="$model" -e SUMMARY_JSON="$dir/k6-summary.json" "tests/perf/scenarios/$script" > "$dir/k6.log" 2>&1
            k6_rc=$?
            kubectl logs -l app=new-api-worker --all-containers=true --prefix=true --tail=-1 > "$dir/worker.log" 2>&1
            pod=$(kubectl get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
            kubectl exec "$pod" -- env PGPASSWORD="$POSTGRES_PASSWORD" psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "COPY (SELECT channel_id,key_index,model,state,isolation_level,dormant_disable_count,local_failure_count,upstream_failure_count,version,updated_at FROM channel_model_health ORDER BY channel_id,key_index,model) TO STDOUT WITH CSV HEADER" > "$dir/channel_model_health.csv" 2>&1
            python3 tests/perf/assertions/state_machine.py --derive-distribution --worker-log "$dir/worker.log" --distribution-json "$dir/distribution.json" || true
            python3 tests/perf/assertions/state_machine.py --scenario "$alias" --health-csv "$dir/channel_model_health.csv" --worker-log "$dir/worker.log" --distribution-json "$dir/distribution.json" --report-file "$dir/assertion-report.md"
            assert_rc=$?
            if [ "$k6_rc" -ne 0 ] || [ "$assert_rc" -ne 0 ]; then overall=1; fi
          done
          exit "$overall"
      - name: Rollback and cleanup
        if: always()
        run: |
          if [ "$ROLLBACK" = true ] && [ -s runtime/logs/master-image-before.txt ]; then
            kubectl set image deployment/new-api-master new-api="$(cat runtime/logs/master-image-before.txt)" || true
            kubectl set image deployment/new-api-worker new-api="$(cat runtime/logs/worker-image-before.txt)" || true
            kubectl rollout status deployment/new-api-master --timeout=300s || true
            kubectl rollout status deployment/new-api-worker --timeout=300s || true
          fi
          kubectl delete deployment/stress-mock service/stress-mock configmap/state-machine-mock --ignore-not-found=true || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-machine-matrix-${{ github.run_id }}
          path: runtime/
          retention-days: 14
      - name: Append matrix summary
        if: always()
        run: |
          for f in runtime/perf/scenario-*/assertion-report.md; do [ -f "$f" ] && { echo "## $f" >> "$GITHUB_STEP_SUMMARY"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; }; done
