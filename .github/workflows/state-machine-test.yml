name: State Machine Stress Test Matrix


"on":
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario to run (1-8 or 'all')"
        type: choice
        required: true
        default: "all"
        options:
          - "all"
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
          - "7"
          - "8"
      target_url:
        description: "Target base URL (e.g. http://gateway:3000)"
        type: string
        required: true
        default: "http://localhost:3000"
      api_key:
        description: "API key for authentication"
        type: string
        required: true
      model:
        description: "Model name to test"
        type: string
        required: false
        default: ""
      vus:
        description: "Virtual users (overrides scenario defaults)"
        type: string
        required: false
        default: ""
      duration:
        description: "Test duration (overrides scenario defaults)"
        type: string
        required: false
        default: ""
      k8s_image_tag:
        description: "Gateway image tag to deploy (optional, for k8s deployments)"
        type: string
        required: false
        default: ""
      rollback_after_test:
        description: "Rollback gateway deployment after test completes"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  state-matrix:
    name: Run State Machine Scenario(s)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_URL: ${{ inputs.target_url }}
      API_KEY: ${{ inputs.api_key }}
      MODEL: ${{ inputs.model }}
      VUS: ${{ inputs.vus }}
      DURATION: ${{ inputs.duration }}
      K8S_IMAGE_TAG: ${{ inputs.k8s_image_tag }}
      ROLLBACK_AFTER_TEST: ${{ inputs.rollback_after_test }}
      SCENARIO: ${{ inputs.scenario }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Set up k6
        uses: grafana/k6-action@v0.2.0
        with:
          version: "latest"

      - name: Deploy stress-mock fixture
        id: deploy-mock
        run: |
          echo "Deploying stress-mock fixture..."
          # In a real k8s environment, this would deploy the mock upstream
          # For local/docker-compose testing, the mock should already be running
          # This step is a placeholder for the actual deployment logic
          kubectl apply -f tests/perf/fixtures/stress-mock.yaml 2>/dev/null || echo "Mock deployment skipped (not in k8s env)"

      - name: Deploy gateway image (optional)
        if: env.K8S_IMAGE_TAG != ''
        id: deploy-gateway
        run: |
          echo "Deploying gateway image: ${{ env.K8S_IMAGE_TAG }}"
          # Placeholder for gateway deployment logic
          # kubectl set image deployment/gateway gateway=${{ env.K8S_IMAGE_TAG }}

      - name: Wait for target /models endpoint
        run: |
          echo "Waiting for ${{ env.TARGET_URL }}/models to be ready..."
          for i in {1..30}; do
            if curl -sf -H "Authorization: Bearer ${{ env.API_KEY }}" "${{ env.TARGET_URL }}/models" >/dev/null; then
              echo "Target is ready"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "Target did not become ready in time"
          exit 1

      - name: Copy scenario files to working directory
        run: |
          mkdir -p /tmp/perf/scenarios /tmp/perf/lib /tmp/perf/assertions
          cp tests/perf/scenarios/*.js /tmp/perf/scenarios/
          cp tests/perf/lib/*.js /tmp/perf/lib/
          cp tests/perf/assertions/*.py /tmp/perf/assertions/

      - name: Run state matrix orchestrator
        id: orchestrator
        run: |
          cd /tmp/perf
          python tests/perf/run_state_matrix.py \
            --scenario "${{ env.SCENARIO }}" \
            --target-url "${{ env.TARGET_URL }}" \
            --api-key "${{ env.API_KEY }}" \
            --model "${{ env.MODEL }}" \
            --vus "${{ env.VUS }}" \
            --duration "${{ env.DURATION }}" \
            --report-dir "${{ runner.temp }}/state-reports"

      - name: Upload per-scenario reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-machine-reports
          path: ${{ runner.temp }}/state-reports/
          retention-days: 7

      - name: Upload matrix summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-machine-matrix-summary
          path: ${{ runner.temp }}/state-reports/matrix-summary.json
          retention-days: 7

      - name: Rollback gateway deployment
        if: always() && env.ROLLBACK_AFTER_TEST == 'true' && env.K8S_IMAGE_TAG != ''
        run: |
          echo "Rolling back gateway deployment..."
          # Placeholder for rollback logic
          # kubectl rollout undo deployment/gateway

      - name: Clean up stress-mock fixture
        if: always()
        run: |
          echo "Cleaning up stress-mock fixture..."
          kubectl delete -f tests/perf/fixtures/stress-mock.yaml 2>/dev/null || echo "Mock cleanup skipped (not in k8s env)"